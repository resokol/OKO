name: Publish verified OKO binary
on:
  push:
    branches: [main]
    paths:
      - '.github/oko/**'
      - '.github/workflows/publish-oko.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oko-binary-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install publication tools
        run: python -m pip install bsdiff4==1.2.6 py7zr==1.1.4
      - name: Reconstruct verified EXE and offline package
        run: python .github/oko/publish.py
      - name: Publish binaries and documentation
        run: |
          git config user.name "OKO release"
          git config user.email "38921770+resokol@users.noreply.github.com"
          git add downloads/OKO-1.8.2-preview.exe downloads/OKO-1.8.2-Vosk-offline.7z downloads/SHA256SUMS.txt README.md docs/dealer-speech.md docs/verification-1.8.2-speech.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified OKO 1.8.2 contextual dealer speech"
            git push origin HEAD:main
          fi
